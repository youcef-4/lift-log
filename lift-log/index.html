<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#ECEFF2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0E1216" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Lift Log">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="icons/favicon-32.png">
<title>Lift Log</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Inter:wght@400;500;600&display=swap">
<style>
/* Layout: one-column phone app — sticky header, scrolling view, fixed bottom tab bar. Chalk-and-steel neutrals, plate-yellow accent. */
:root{
  --bg:#ECEFF2; --surface:#FFFFFF; --sunk:#F4F6F8; --ink:#141920; --muted:#5A6471; --line:#D5DAE1;
  --accent:#F2C200; --on-accent:#141920; --accent-text:#7D5E00; --danger:#B8342A; --good:#2E7D4F;
  --display:"Barlow Condensed","Arial Narrow",system-ui,sans-serif;
  --body:"Inter",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:12px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#0E1216; --surface:#171C22; --sunk:#12161B; --ink:#E8EBEE; --muted:#8F99A5; --line:#29303A;
  --accent:#F2C200; --on-accent:#141920; --accent-text:#F2C200; --danger:#FF6A5C; --good:#5CCB8A; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#0E1216; --surface:#171C22; --sunk:#12161B; --ink:#E8EBEE; --muted:#8F99A5; --line:#29303A;
  --accent:#F2C200; --on-accent:#141920; --accent-text:#F2C200; --danger:#FF6A5C; --good:#5CCB8A; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15px;line-height:1.45;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(84px + env(safe-area-inset-bottom,0px));margin:0;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
img{max-width:100%}
[hidden]{display:none!important}
.wrap{max-width:560px;margin:0 auto}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);display:flex;align-items:baseline;justify-content:space-between;gap:12px;padding-block:calc(14px + env(safe-area-inset-top,0px)) 10px}
.brand{font-family:var(--display);font-weight:700;font-size:26px;letter-spacing:.02em;text-transform:uppercase;margin:0;display:flex;align-items:center;gap:8px}
.brand i{display:inline-block;width:14px;height:22px;border-radius:3px;background:var(--accent)}
.sync{font-size:12px;color:var(--muted);text-align:right}
.status{font-size:13px;color:var(--danger);margin:0 0 10px}
h2{font-family:var(--display);font-weight:700;font-size:30px;line-height:1.05;margin:4px 0 2px;text-wrap:balance;letter-spacing:.01em}
.sub{color:var(--muted);font-size:13px;margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.row{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.spread{display:flex;align-items:center;justify-content:space-between;gap:8px}
button{font:inherit;color:inherit;cursor:pointer}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:10px 14px;font-weight:600;min-height:44px}
.btn.primary{background:var(--accent);color:var(--on-accent);border-color:transparent}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger);border-color:var(--danger);background:transparent}
.btn.block{width:100%}
.btn.small{min-height:36px;padding:6px 10px;font-size:13px}
button:focus-visible,input:focus-visible,select:focus-visible,a:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.ex-name{font-family:var(--display);font-weight:600;font-size:22px;letter-spacing:.01em;margin:0;min-width:0;overflow-wrap:anywhere}
.last{font-size:12.5px;color:var(--muted);margin:2px 0 10px;font-variant-numeric:tabular-nums}
.last b{color:var(--accent-text);font-weight:600}
.sets{display:grid;grid-template-columns:22px 1fr 1fr 34px;gap:6px 6px;align-items:center}
.sets .h{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);text-align:center}
.sets .n{font-family:var(--display);font-weight:600;font-size:18px;color:var(--muted);text-align:center}
.step{display:flex;align-items:stretch;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--sunk);min-width:0}
.step button{border:0;background:transparent;width:34px;flex:0 0 34px;font-size:20px;line-height:1;color:var(--muted)}
.step button:active{background:var(--line)}
.step input{flex:1 1 auto;min-width:0;width:100%;border:0;background:transparent;text-align:center;font-family:var(--display);font-weight:600;font-size:22px;color:var(--ink);padding:6px 0;font-variant-numeric:tabular-nums}
.x{border:0;background:transparent;color:var(--muted);font-size:20px;height:40px}
.add-set{margin-top:10px}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:7px 12px;font-size:13px;font-weight:500;min-height:36px}
.field{display:flex;gap:8px}
.field input{flex:1;min-width:0;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:10px 12px;font:inherit;min-height:44px}
input[type=date],select{border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:10px;padding:8px 10px;font:inherit;min-height:40px;max-width:100%}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.1em;color:var(--muted);font-weight:600;margin:0 0 8px}
.empty{text-align:center;padding:28px 16px}
.empty p{color:var(--muted);margin:6px 0 16px}
.tiles{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.tile{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;min-width:0}
.tile .k{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted)}
.tile .v{font-family:var(--display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.tile .v small{font-size:15px;font-weight:500;color:var(--muted)}
.hist-ex{display:grid;grid-template-columns:minmax(0,1fr);gap:2px;margin:10px 0 0;padding:0;list-style:none}
.hist-ex li{font-size:13.5px;font-variant-numeric:tabular-nums;overflow-wrap:anywhere}
.hist-ex li span{color:var(--muted)}
.meta{font-size:12.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.date-big{font-family:var(--display);font-weight:700;font-size:22px;margin:0}
.chart{width:100%;overflow:hidden}
.chart svg{display:block;width:100%;height:auto}
.legend{display:flex;gap:14px;font-size:12px;color:var(--muted);margin-top:6px}
.legend span{display:inline-flex;align-items:center;gap:6px}
.legend i{width:14px;height:3px;border-radius:2px;display:inline-block}
.tbl-wrap{overflow-x:auto}
table{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
th,td{text-align:left;padding:8px 6px;border-bottom:1px solid var(--line);white-space:nowrap}
th{font-size:11px;text-transform:uppercase;letter-spacing:.08em;color:var(--muted);font-weight:600}
td.r,th.r{text-align:right}
.pr{display:inline-block;font-size:10px;font-weight:700;letter-spacing:.08em;background:var(--accent);color:var(--on-accent);border-radius:4px;padding:1px 5px;margin-left:6px;vertical-align:2px}
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:6;background:var(--surface);border-top:1px solid var(--line);
  display:grid;grid-template-columns:repeat(3,1fr);
  padding:6px max(8px,env(safe-area-inset-right,0px)) calc(6px + env(safe-area-inset-bottom,0px)) max(8px,env(safe-area-inset-left,0px))}
nav.tabs a{display:flex;flex-direction:column;align-items:center;gap:2px;text-decoration:none;color:var(--muted);font-size:12px;font-weight:600;padding:6px 0;border-radius:10px}
nav.tabs a svg{width:22px;height:22px}
nav.tabs a[aria-current="page"]{color:var(--ink)}
nav.tabs a[aria-current="page"] svg{color:var(--accent-text)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(82px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:13.5px;font-weight:500;z-index:9;max-width:calc(100% - 32px)}
.confirm{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:13.5px}
@media (prefers-reduced-motion:no-preference){.card{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <p class="brand"><i aria-hidden="true"></i>Lift Log</p>
    <span class="sync" id="sync">Loading…</span>
  </header>
  <p class="status" id="status" hidden></p>
  <main id="view" class="stack"></main>
</div>

<nav class="tabs" aria-label="Sections">
  <a href="#log" data-tab="log"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 9v6M6 6v12M18 6v12M21 9v6M6 12h12"/></svg>Workout</a>
  <a href="#history" data-tab="history"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>History</a>
  <a href="#progress" data-tab="progress"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M5 15l4-4 4 3 6-7"/></svg>Progress</a>
</nav>
<div class="toast" id="toast" hidden></div>
<datalist id="exlist"></datalist>

<script>
(function(){
const DEFAULT_EX=["Bench press","Incline dumbbell press","Overhead press","Squat","Deadlift","Romanian deadlift","Leg press","Pull-up","Lat pulldown","Barbell row","Seated cable row","Bicep curl","Hammer curl","Tricep pushdown","Lateral raise","Leg curl","Leg extension","Calf raise","Hip thrust","Dips"];
const LKEY="liftlog.sessions.v1";
const S={sessions:new Map(),deleted:new Set(),confirm:null,progEx:null,loaded:false};
const $=s=>document.querySelector(s);
const view=$("#view");
let needRender=false;

const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const clone=o=>JSON.parse(JSON.stringify(o));
const fmtW=n=>{n=Math.round((+n||0)*100)/100;return String(n)};
const num=v=>{const n=parseFloat(String(v).replace(",","."));return isFinite(n)?n:0};
const e1rm=(w,r)=>r<=0||w<=0?0:(r===1?w:w*(1+r/30));
const today=()=>{const d=new Date();return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0")};
const fmtDate=(iso,opts)=>{const [y,m,d]=iso.split("-").map(Number);return new Date(y,m-1,d).toLocaleDateString(undefined,opts||{weekday:"short",day:"numeric",month:"short"})};
const fmtTime=ms=>new Date(ms).toLocaleTimeString(undefined,{hour:"2-digit",minute:"2-digit"});
const newId=()=>"s"+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const vol=ex=>ex.sets.reduce((a,s)=>a+(+s.w||0)*(+s.r||0),0);
const sessVol=s=>s.exercises.reduce((a,e)=>a+vol(e),0);
const fmtVol=v=>v>=10000?(Math.round(v/100)/10)+"t":Math.round(v).toLocaleString()+" kg";

function toast(msg){const t=$("#toast");t.textContent=msg;t.hidden=false;clearTimeout(toast._t);toast._t=setTimeout(()=>t.hidden=true,2200)}
function setStatus(msg){const s=$("#status");s.textContent=msg||"";s.hidden=!msg}

/* ---------- storage (on this phone) ---------- */
const BKEY="liftlog.lastBackup.v1";
function loadLocal(){
  try{const raw=localStorage.getItem(LKEY);if(raw){const arr=JSON.parse(raw);arr.forEach(s=>S.sessions.set(s.id,s))}}catch(e){}
}
function saveLocal(){
  try{localStorage.setItem(LKEY,JSON.stringify([...S.sessions.values()]))}
  catch(e){setStatus("Your phone refused to save. Free up some storage, then make a backup.")}
}
function save(){saveLocal()}
function lastBackup(){try{return +localStorage.getItem(BKEY)||0}catch(e){return 0}}

async function exportBackup(){
  const data={app:"lift-log",version:1,exportedAt:new Date().toISOString(),sessions:[...S.sessions.values()]};
  const name="lift-log-backup-"+today()+".json";
  const blob=new Blob([JSON.stringify(data,null,1)],{type:"application/json"});
  let done=false;
  try{
    const file=new File([blob],name,{type:"application/json"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){await navigator.share({files:[file],title:"Lift Log backup"});done=true}
  }catch(e){if(e&&e.name==="AbortError")return}
  if(!done){
    const url=URL.createObjectURL(blob);const a=document.createElement("a");
    a.href=url;a.download=name;document.body.appendChild(a);a.click();a.remove();
    setTimeout(()=>URL.revokeObjectURL(url),4000);
  }
  try{localStorage.setItem(BKEY,String(Date.now()))}catch(e){}
  toast("Backup saved");render();
}
function importBackup(file){
  const r=new FileReader();
  r.onload=()=>{
    try{
      const data=JSON.parse(r.result);
      const list=Array.isArray(data)?data:data.sessions;
      if(!Array.isArray(list))throw 0;
      let n=0;
      list.forEach(s=>{
        if(!s||typeof s.id!=="string"||!Array.isArray(s.exercises)||typeof s.date!=="string")return;
        S.sessions.set(s.id,{id:s.id,type:"session",date:s.date,startedAt:+s.startedAt||Date.now(),finishedAt:s.finishedAt?+s.finishedAt:null,
          exercises:s.exercises.filter(e=>e&&e.name&&Array.isArray(e.sets)).map(e=>({name:String(e.name).slice(0,60),sets:e.sets.map(x=>({w:Math.max(0,num(x.w)),r:Math.max(0,Math.round(num(x.r)))}))}))});
        n++;
      });
      saveLocal();toast(n?"Restored "+n+" workout"+(n===1?"":"s"):"No workouts found in that file");render();
    }catch(e){toast("That file isn't a Lift Log backup")}
  };
  r.onerror=()=>toast("Couldn't read that file");
  r.readAsText(file);
}

function initStore(){
  loadLocal();S.loaded=true;
  $("#sync").textContent=navigator.onLine?"Saved on this phone":"Offline · saved on this phone";
  try{navigator.storage&&navigator.storage.persist&&navigator.storage.persist()}catch(e){}
  render();
}
window.addEventListener("online",()=>$("#sync").textContent="Saved on this phone");
window.addEventListener("offline",()=>$("#sync").textContent="Offline · saved on this phone");
window.addEventListener("storage",ev=>{if(ev.key===LKEY){S.sessions=new Map();loadLocal();requestRender()}});
if("serviceWorker" in navigator){window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js").catch(()=>{}))}

/* ---------- derived ---------- */
const sorted=()=>[...S.sessions.values()].sort((a,b)=>(b.date+b.startedAt).localeCompare(a.date+a.startedAt));
const finished=()=>sorted().filter(s=>s.finishedAt);
const active=()=>sorted().filter(s=>!s.finishedAt).sort((a,b)=>b.startedAt-a.startedAt)[0]||null;
function exNames(){
  const seen=new Map();
  sorted().forEach(s=>s.exercises.forEach(e=>{const k=e.name.toLowerCase();if(!seen.has(k))seen.set(k,e.name)}));
  return [...seen.values()];
}
function lastFor(name,excludeId){
  const k=name.toLowerCase();
  for(const s of finished()){if(s.id===excludeId)continue;const e=s.exercises.find(x=>x.name.toLowerCase()===k&&x.sets.length);if(e)return{s,e}}
  return null;
}
const setsText=sets=>sets.filter(s=>+s.r>0).map(s=>fmtW(s.w)+"×"+s.r).join(" · ");

/* ---------- render ---------- */
function requestRender(){
  const a=document.activeElement;
  if(a&&a.closest&&a.closest("#view")&&a.matches("input,select,textarea")){needRender=true;return}
  render();
}
document.addEventListener("focusout",()=>setTimeout(()=>{
  if(!needRender)return;const a=document.activeElement;
  if(a&&a.closest&&a.closest("#view")&&a.matches("input,select,textarea"))return;
  needRender=false;render();
},0));

function tab(){const h=location.hash.slice(1);return ["log","history","progress"].includes(h)?h:"log"}
function render(){
  const t=tab();
  document.querySelectorAll("nav.tabs a").forEach(a=>a.toggleAttribute("aria-current",false)||a.dataset.tab===t&&a.setAttribute("aria-current","page"));
  $("#exlist").innerHTML=[...new Set([...exNames(),...DEFAULT_EX])].map(n=>`<option value="${esc(n)}">`).join("");
  if(!S.loaded){view.innerHTML=`<div class="card empty"><p>Loading your workouts…</p></div>`;return}
  view.innerHTML=t==="log"?renderLog():t==="history"?renderHistory():renderProgress();
  if(t==="progress")drawChart();
}

function renderLog(){
  const a=active();
  if(!a){
    const last=finished()[0];
    return `<section class="stack">
      <div><h2>Ready to train?</h2><p class="sub">${esc(fmtDate(today(),{weekday:"long",day:"numeric",month:"long"}))}</p></div>
      <button class="btn primary block" data-act="start-empty" style="min-height:54px;font-size:16px">Start new workout</button>
      ${finished().length>=3&&Date.now()-lastBackup()>14*864e5?`<a class="card sub" href="#history" style="text-decoration:none;display:block">It's been a while since your last backup. <b style="color:var(--accent-text)">Save one in History →</b></a>`:""}
      ${last?`<div class="card">
        <p class="label">Last workout · ${esc(fmtDate(last.date))}</p>
        <ul class="hist-ex" style="margin-top:0">${last.exercises.map(e=>`<li>${esc(e.name)} <span>${esc(setsText(e.sets))}</span></li>`).join("")}</ul>
        <button class="btn block" data-act="start-repeat" data-id="${esc(last.id)}" style="margin-top:12px">Repeat this workout</button>
        <p class="sub" style="margin-top:6px">Copies the exercises and last weights so you only adjust what changed.</p>
      </div>`:`<div class="card empty"><p class="label">How it works</p><p>Start a workout, add exercises, and log each set's weight and reps. Your sessions build your history and progress charts.</p></div>`}
    </section>`;
  }
  const others=exNames().filter(n=>!a.exercises.some(e=>e.name.toLowerCase()===n.toLowerCase()));
  const quick=(others.length?others:DEFAULT_EX.filter(n=>!a.exercises.some(e=>e.name.toLowerCase()===n.toLowerCase()))).slice(0,10);
  const v=sessVol(a);
  return `<section class="stack">
    <div class="spread" style="align-items:flex-end">
      <div><h2>Today's workout</h2><p class="sub">Started ${esc(fmtTime(a.startedAt))} · ${a.exercises.length} exercise${a.exercises.length===1?"":"s"} · <span id="sessvol">${esc(fmtVol(v))}</span></p></div>
      <input type="date" id="sess-date" value="${esc(a.date)}" aria-label="Workout date">
    </div>
    ${a.exercises.map((e,i)=>exCard(a,e,i)).join("")}
    <div class="card">
      <p class="label">Add exercise</p>
      <form class="field" id="add-ex-form"><input id="add-ex" list="exlist" placeholder="e.g. Bench press" autocomplete="off" enterkeyhint="done"><button class="btn primary" type="submit">Add</button></form>
      ${quick.length?`<div class="chips" style="margin-top:10px">${quick.map(n=>`<button class="chip" data-act="quick-ex" data-name="${esc(n)}">+ ${esc(n)}</button>`).join("")}</div>`:""}
    </div>
    <button class="btn primary block" data-act="finish" style="min-height:52px;font-size:16px">Finish &amp; save workout</button>
    ${S.confirm==="discard"?`<div class="confirm card"><span>Delete this workout and everything logged in it?</span><button class="btn danger small" data-act="discard-yes">Delete workout</button><button class="btn small ghost" data-act="cancel">Keep it</button></div>`
      :`<button class="btn ghost block" data-act="discard" style="color:var(--muted)">Discard workout</button>`}
  </section>`;
}
function exCard(a,e,i){
  const last=lastFor(e.name,a.id);
  return `<div class="card">
    <div class="spread"><h3 class="ex-name">${esc(e.name)}</h3>
      ${S.confirm==="rm-"+i?`<span class="confirm"><button class="btn danger small" data-act="rm-ex-yes" data-ex="${i}">Remove</button><button class="btn small ghost" data-act="cancel">Cancel</button></span>`
        :`<button class="btn small ghost" data-act="rm-ex" data-ex="${i}" aria-label="Remove ${esc(e.name)}">Remove</button>`}</div>
    <p class="last">${last?`Last time (${esc(fmtDate(last.s.date,{day:"numeric",month:"short"}))}): <b>${esc(setsText(last.e.sets))}</b>`:"First time logging this exercise"}</p>
    <div class="sets">
      <span class="h">#</span><span class="h">kg</span><span class="h">reps</span><span></span>
      ${e.sets.map((s,j)=>`<span class="n">${j+1}</span>
        <div class="step"><button data-act="step" data-ex="${i}" data-set="${j}" data-f="w" data-d="-2.5" aria-label="Less weight">−</button><input data-f="w" data-ex="${i}" data-set="${j}" id="w-${i}-${j}" inputmode="decimal" value="${esc(fmtW(s.w))}" aria-label="Set ${j+1} weight in kg"><button data-act="step" data-ex="${i}" data-set="${j}" data-f="w" data-d="2.5" aria-label="More weight">+</button></div>
        <div class="step"><button data-act="step" data-ex="${i}" data-set="${j}" data-f="r" data-d="-1" aria-label="Fewer reps">−</button><input data-f="r" data-ex="${i}" data-set="${j}" id="r-${i}-${j}" inputmode="numeric" value="${esc(s.r)}" aria-label="Set ${j+1} reps"><button data-act="step" data-ex="${i}" data-set="${j}" data-f="r" data-d="1" aria-label="More reps">+</button></div>
        <button class="x" data-act="del-set" data-ex="${i}" data-set="${j}" aria-label="Delete set ${j+1}">×</button>`).join("")}
    </div>
    <button class="btn block add-set" data-act="add-set" data-ex="${i}">+ Add set</button>
  </div>`;
}

function renderHistory(){
  const list=finished();
  if(!list.length)return `<div><h2>History</h2></div><div class="card empty"><p class="label">No workouts yet</p><p>Finished workouts show up here, newest first.</p><a class="btn primary" href="#log" style="display:inline-flex;align-items:center;text-decoration:none">Start a workout</a></div>${backupCard()}`;
  const hasActive=!!active();
  const weekAgo=Date.now()-7*864e5;
  const thisWeek=list.filter(s=>s.finishedAt>=weekAgo).length;
  return `<div><h2>History</h2><p class="sub">${list.length} workout${list.length===1?"":"s"} logged · ${thisWeek} in the last 7 days</p></div>
  ${list.map(s=>{
    const mins=s.finishedAt&&s.startedAt?Math.max(1,Math.round((s.finishedAt-s.startedAt)/60000)):null;
    const sets=s.exercises.reduce((a,e)=>a+e.sets.length,0);
    return `<article class="card">
      <div class="spread"><p class="date-big">${esc(fmtDate(s.date))}</p><span class="meta">${mins&&mins<600?mins+" min · ":""}${sets} sets · ${esc(fmtVol(sessVol(s)))}</span></div>
      <ul class="hist-ex">${s.exercises.map(e=>`<li>${esc(e.name)} <span>${esc(setsText(e.sets))}</span></li>`).join("")}</ul>
      <div class="row" style="margin-top:10px">
      ${S.confirm==="del-"+s.id?`<span class="confirm"><span>Delete this workout for good?</span><button class="btn danger small" data-act="hist-del-yes" data-id="${esc(s.id)}">Delete</button><button class="btn small ghost" data-act="cancel">Cancel</button></span>`
        :`<button class="btn small" data-act="hist-edit" data-id="${esc(s.id)}" ${hasActive?"disabled title='Finish your current workout first'":""}>Edit</button><button class="btn small ghost" data-act="hist-del" data-id="${esc(s.id)}" style="color:var(--muted)">Delete</button>`}
      </div>
    </article>`}).join("")}
  ${backupCard()}`;
}
function backupCard(){
  const lb=lastBackup();
  const days=lb?Math.floor((Date.now()-lb)/864e5):null;
  return `<div class="card">
    <p class="label">Backup</p>
    <p class="sub" style="margin-bottom:10px">Your workouts are stored only on this phone. Save a backup to iCloud Drive, Google Drive or Files now and then. ${lb?`Last backup: ${days===0?"today":days===1?"yesterday":days+" days ago"}.`:"No backup yet."}</p>
    <div class="row"><button class="btn primary" data-act="backup">Save backup</button>
    <label class="btn" style="display:inline-flex;align-items:center">Restore from file<input type="file" id="restore-file" accept="application/json,.json" hidden></label></div>
  </div>`;
}

function exHistory(name){
  const k=name.toLowerCase();
  return finished().slice().reverse().map(s=>{
    const e=s.exercises.find(x=>x.name.toLowerCase()===k);if(!e)return null;
    const sets=e.sets.filter(x=>+x.r>0);if(!sets.length)return null;
    let top=sets[0],best=0;
    sets.forEach(x=>{if(+x.w>+top.w||(+x.w===+top.w&&+x.r>+top.r))top=x;best=Math.max(best,e1rm(+x.w,+x.r))});
    return {date:s.date,sets,top,e1:best,vol:vol(e)};
  }).filter(Boolean);
}
function renderProgress(){
  const names=exNames().filter(n=>exHistory(n).length);
  if(!names.length)return `<div><h2>Progress</h2></div><div class="card empty"><p class="label">Nothing to chart yet</p><p>Finish a workout and each exercise gets its own progress chart and personal records.</p><a class="btn primary" href="#log" style="display:inline-flex;align-items:center;text-decoration:none">Start a workout</a></div>`;
  if(!S.progEx||!names.includes(S.progEx))S.progEx=names[0];
  const h=exHistory(S.progEx);
  const maxW=h.reduce((a,x)=>+x.top.w>+a.top.w?x:a,h[0]);
  const maxE=h.reduce((a,x)=>x.e1>a.e1?x:a,h[0]);
  const maxV=h.reduce((a,x)=>x.vol>a.vol?x:a,h[0]);
  const first=h[0],lastS=h[h.length-1];
  const delta=h.length>1?Math.round((lastS.e1-first.e1)*10)/10:null;
  return `<div><h2>Progress</h2><p class="sub">Pick an exercise to see how it's moving.</p></div>
  <select id="prog-ex" aria-label="Exercise">${names.map(n=>`<option ${n===S.progEx?"selected":""}>${esc(n)}</option>`).join("")}</select>
  <div class="tiles">
    <div class="tile"><div class="k">Heaviest set</div><div class="v">${esc(fmtW(maxW.top.w))}<small> kg × ${esc(maxW.top.r)}</small></div></div>
    <div class="tile"><div class="k">Best est. 1RM</div><div class="v">${esc(fmtW(Math.round(maxE.e1*10)/10))}<small> kg</small></div></div>
    <div class="tile"><div class="k">Sessions</div><div class="v">${h.length}</div></div>
    <div class="tile"><div class="k">1RM change</div><div class="v">${delta===null?"—":(delta>0?"+":"")+esc(fmtW(delta))}<small>${delta===null?"":" kg"}</small></div></div>
  </div>
  <div class="card">
    <p class="label">Estimated 1RM and top set, per session</p>
    <div class="chart" id="chart"></div>
    <div class="legend"><span><i style="background:var(--accent)"></i>Est. 1RM (Epley)</span><span><i style="background:var(--muted)"></i>Top set weight</span></div>
  </div>
  <div class="card"><p class="label">Every session</p><div class="tbl-wrap"><table>
    <thead><tr><th>Date</th><th>Sets</th><th class="r">Top</th><th class="r">Volume</th></tr></thead>
    <tbody>${h.slice().reverse().map(x=>`<tr><td>${esc(fmtDate(x.date,{day:"numeric",month:"short",year:"2-digit"}))}${x===maxE?'<span class="pr">PR</span>':""}</td><td style="white-space:normal">${esc(setsText(x.sets))}</td><td class="r">${esc(fmtW(x.top.w))}×${esc(x.top.r)}</td><td class="r">${esc(fmtVol(x.vol))}</td></tr>`).join("")}</tbody>
  </table></div></div>`;
}
function niceStep(range,count){const raw=range/count;const p=Math.pow(10,Math.floor(Math.log10(raw)));const f=raw/p;return (f<=1?1:f<=2?2:f<=2.5?2.5:f<=5?5:10)*p}
function drawChart(){
  const el=$("#chart");if(!el)return;
  const h=exHistory(S.progEx);
  const W=Math.max(280,el.clientWidth||320),H=200,L=40,R=12,T=12,B=26;
  const vals=h.flatMap(x=>[x.e1,+x.top.w]);
  let lo=Math.min(...vals),hi=Math.max(...vals);
  if(hi-lo<5){lo-=2.5;hi+=2.5}
  const step=niceStep(hi-lo,4);lo=Math.floor(lo/step)*step;hi=Math.ceil(hi/step)*step;
  const x=i=>h.length===1?L+(W-L-R)/2:L+i*(W-L-R)/(h.length-1);
  const y=v=>T+(hi-v)/(hi-lo)*(H-T-B);
  let g="";
  for(let v=lo;v<=hi+1e-9;v+=step){g+=`<line x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" stroke="var(--line)" stroke-width="1"/><text x="${L-6}" y="${y(v)+4}" text-anchor="end" font-size="11" fill="var(--muted)">${fmtW(v)}</text>`}
  const idx=h.length<=3?h.map((_,i)=>i):[0,Math.floor((h.length-1)/2),h.length-1];
  idx.forEach(i=>{const anchor=h.length===1?"middle":i===0?"start":i===h.length-1?"end":"middle";g+=`<text x="${x(i)}" y="${H-6}" text-anchor="${anchor}" font-size="11" fill="var(--muted)">${esc(fmtDate(h[i].date,{day:"numeric",month:"short"}))}</text>`});
  const path=(f)=>h.map((d,i)=>(i?"L":"M")+x(i).toFixed(1)+" "+y(f(d)).toFixed(1)).join(" ");
  const area=h.length>1?`<path d="${path(d=>d.e1)} L${x(h.length-1)} ${H-B} L${x(0)} ${H-B} Z" fill="var(--accent)" fill-opacity=".14"/>`:"";
  const dots=(f,c,r)=>h.map((d,i)=>`<circle cx="${x(i)}" cy="${y(f(d))}" r="${r}" fill="${c}"/>`).join("");
  const li=h.length-1;
  el.innerHTML=`<svg viewBox="0 0 ${W} ${H}" width="${W}" height="${H}" role="img" aria-label="Progress chart for ${esc(S.progEx)}">${g}${area}
    <path d="${path(d=>+d.top.w)}" fill="none" stroke="var(--muted)" stroke-width="1.5" stroke-dasharray="4 3"/>${dots(d=>+d.top.w,"var(--muted)",2.5)}
    <path d="${path(d=>d.e1)}" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>${dots(d=>d.e1,"var(--accent)",3)}
    <circle cx="${x(li)}" cy="${y(h[li].e1)}" r="5.5" fill="var(--surface)" stroke="var(--accent)" stroke-width="2.5"/></svg>`;
}

/* ---------- actions ---------- */
function startSession(exercises){
  const s={id:newId(),type:"session",date:today(),startedAt:Date.now(),finishedAt:null,exercises:exercises||[]};
  S.sessions.set(s.id,s);save(s.id);render();
}
function addExercise(name){
  name=(name||"").trim().replace(/\s+/g," ").slice(0,60);if(!name)return;
  const a=active();if(!a)return;
  if(a.exercises.some(e=>e.name.toLowerCase()===name.toLowerCase())){toast(name+" is already in this workout");return}
  const last=lastFor(name,a.id);
  const sets=last?last.e.sets.filter(s=>+s.r>0).map(s=>({w:+s.w,r:+s.r})):[{w:20,r:10}];
  a.exercises.push({name,sets:sets.length?sets:[{w:20,r:10}]});
  save(a.id);render();
}
view.addEventListener("click",ev=>{
  const b=ev.target.closest("[data-act]");if(!b)return;
  const act=b.dataset.act,a=active(),i=+b.dataset.ex,j=+b.dataset.set;
  if(act==="start-empty")return startSession([]);
  if(act==="start-repeat"){const src=S.sessions.get(b.dataset.id);return startSession(src?clone(src.exercises).map(e=>({name:e.name,sets:e.sets.filter(s=>+s.r>0)})):[])}
  if(act==="quick-ex")return addExercise(b.dataset.name);
  if(act==="cancel"){S.confirm=null;return render()}
  if(act==="backup")return exportBackup();
  if(act==="hist-del"){S.confirm="del-"+b.dataset.id;return render()}
  if(act==="hist-del-yes"){const id=b.dataset.id;S.sessions.delete(id);S.deleted.add(id);S.confirm=null;save(id);toast("Workout deleted");return render()}
  if(act==="hist-edit"){const s=S.sessions.get(b.dataset.id);if(!s||active())return;s.finishedAt=null;save(s.id);location.hash="#log";return render()}
  if(!a)return;
  const e=a.exercises[i];
  if(act==="step"&&e){
    const s=e.sets[j];if(!s)return;const f=b.dataset.f,d=+b.dataset.d;
    s[f]=Math.max(0,Math.round(((+s[f]||0)+d)*100)/100);
    const inp=document.getElementById(f+"-"+i+"-"+j);if(inp)inp.value=f==="w"?fmtW(s.w):s.r;
    $("#sessvol")&&($("#sessvol").textContent=fmtVol(sessVol(a)));
    return save(a.id);
  }
  if(act==="add-set"&&e){const l=e.sets[e.sets.length-1]||{w:20,r:10};e.sets.push({w:+l.w,r:+l.r});save(a.id);return render()}
  if(act==="del-set"&&e){e.sets.splice(j,1);save(a.id);return render()}
  if(act==="rm-ex"){S.confirm="rm-"+i;return render()}
  if(act==="rm-ex-yes"){a.exercises.splice(i,1);S.confirm=null;save(a.id);return render()}
  if(act==="discard"){S.confirm="discard";return render()}
  if(act==="discard-yes"){S.sessions.delete(a.id);S.deleted.add(a.id);S.confirm=null;save(a.id);toast("Workout discarded");return render()}
  if(act==="finish"){
    a.exercises.forEach(x=>x.sets=x.sets.filter(s=>+s.r>0));
    a.exercises=a.exercises.filter(x=>x.sets.length);
    if(!a.exercises.length){toast("Log at least one set with reps before finishing");return}
    a.finishedAt=Math.max(Date.now(),a.startedAt+60000);save(a.id);
    toast("Workout saved · "+fmtVol(sessVol(a)));location.hash="#history";render();
  }
});
view.addEventListener("input",ev=>{
  const t=ev.target;if(!t.dataset||!t.dataset.f)return;
  const a=active();if(!a)return;const e=a.exercises[+t.dataset.ex];if(!e)return;const s=e.sets[+t.dataset.set];if(!s)return;
  if(t.dataset.f==="w")s.w=Math.max(0,num(t.value));else s.r=Math.max(0,Math.round(num(t.value)));
  $("#sessvol")&&($("#sessvol").textContent=fmtVol(sessVol(a)));
  save(a.id);
});
view.addEventListener("focusin",ev=>{const t=ev.target;if(t.dataset&&t.dataset.f)setTimeout(()=>{try{t.select()}catch(e){}},0)});
view.addEventListener("change",ev=>{
  const t=ev.target;
  if(t.id==="sess-date"){const a=active();if(a&&t.value){a.date=t.value;save(a.id)}}
  if(t.id==="prog-ex"){S.progEx=t.value;t.blur();render()}
  if(t.id==="restore-file"&&t.files&&t.files[0]){importBackup(t.files[0]);t.value=""}
});
view.addEventListener("submit",ev=>{
  if(ev.target.id!=="add-ex-form")return;ev.preventDefault();
  const inp=$("#add-ex");const v=inp.value;inp.value="";inp.blur();addExercise(v);
});
window.addEventListener("hashchange",()=>{S.confirm=null;window.scrollTo(0,0);render()});
let rz;window.addEventListener("resize",()=>{clearTimeout(rz);rz=setTimeout(()=>{if(tab()==="progress")drawChart()},150)});

render();
initStore();
})();
</script>
</body>
